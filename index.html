<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renta.ph: services, rentals and products near you</title>
<meta name="description" content="Find services, rent a car or apartment, and buy from local providers in Cebu. Post your own listing for free.">
<meta name="theme-color" content="#0e5a5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="Renta.ph">
<meta property="og:description" content="Services, car and apartment rentals, and products from people near you.">
<meta property="og:image" content="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="top">
    <div class="logo" aria-label="Renta.ph">renta<i></i><span>ph</span></div>
    <div class="tag">Services, car and apartment rentals, and products from people near you</div>
    <button type="button" class="acct" id="acct">Sign in</button>
  </div>
  <div class="search">
    <input id="q" type="text" placeholder="Search aircon cleaning, Vios, studio…" aria-label="Search listings">
    <select id="city" aria-label="City"><option value="">All areas</option></select>
  </div>
  <div class="cats" id="cats" role="group" aria-label="Category"></div>
</header>

<main><div class="wrap" id="view"><div class="note">Loading Renta.ph…</div></div></main>

<nav class="tabs" aria-label="Sections">
  <a href="#explore" data-v="explore"></a>
  <a href="#saved" data-v="saved"></a>
  <a href="#requests" data-v="requests"></a>
  <a href="#mine" data-v="mine"></a>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><div class="note">Renta.ph needs JavaScript turned on.</div></noscript>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
