name: Publish to rentaph.web.app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Waiting for the Firebase key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT secret to publish to rentaph.web.app."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: renta-ph-856ae
          target: main
          channelId: live
